<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lecture Notebook AI</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { width: 308px; margin: 0; padding: 18px; background: #08111b; color: #e8f7f5; font: 14px system-ui, sans-serif; }
    header { display: flex; gap: 11px; align-items: center; }
    header img { width: 42px; height: 42px; border-radius: 11px; }
    h1 { margin: 0; font: 700 18px Georgia, serif; }
    .mark { color: #5be7ff; font-size: 10px; font-weight: 800; letter-spacing: .14em; margin-bottom: 12px; }
    .intro { color: #9ab2b9; line-height: 1.45; font-size: 12px; margin: 13px 0 16px; }
    .options { display: grid; gap: 9px; }
    button { width: 100%; border: 0; border-radius: 10px; padding: 12px; color: #061019; background: #5be7ff; font-weight: 800; cursor: pointer; text-align: left; }
    button:hover { background: #a0f5ff; }
    button.secondary { color: #c9eee5; background: #16313a; }
    button.secondary:hover { background: #20505b; }
    button.stop { color: #fff2f0; background: #b85662; }
    button.stop:hover { background: #d97079; }
    button:disabled { opacity: .55; cursor: wait; }
    .option-title { display: block; font-size: 13px; }
    .option-copy { display: block; margin-top: 3px; color: #42636b; font-size: 10px; font-weight: 600; }
    .secondary .option-copy, .stop .option-copy { color: #9cc6c0; }
    .status { min-height: 17px; margin-top: 13px; color: #9dd8c7; font-size: 11px; line-height: 1.4; }
    .privacy { display: block; margin-top: 11px; color: #5be7ff; font-size: 11px; text-decoration: none; }
    .privacy:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="mark">LOCAL-FIRST · V1.04</div>
  <header><img src="icons/icon128.png" alt="Lecture Notebook AI logo"><h1>Lecture Notebook AI</h1></header>
  <p class="intro">Choose what you want to do. Recording always opens Chrome&apos;s picker first, and nothing starts without your confirmation.</p>
  <div class="options">
    <button id="open" type="button"><span class="option-title">Open website</span><span class="option-copy">Launch the full study workspace</span></button>
    <button id="record" class="secondary" type="button"><span class="option-title">Start recording</span><span class="option-copy">Choose a tab, window, or screen</span></button>
  </div>
  <div id="status" class="status" role="status">Ready when you are.</div>
  <a class="privacy" href="https://lecturenoteb-hxgiwwjj.manus.space/privacy.html" target="_blank" rel="noreferrer">Privacy policy</a>
  <script src="popup.js"></script>
</body>
</html>
